[package]
name = "samriddhi"
version = "0.1.0"
description = "Samriddhi: your money, work and people in one picture, with safe next steps"
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "samriddhi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
samriddhi-core = { version = "0.1.0", path = "../../core" }
tauri-plugin-samriddhi-device = { version = "0.1.0", path = "../../plugins/device" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# For AI narration. Both are already here through the updater, with these
# same features, so they add no new crates.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.5.0"
tauri-plugin-fs = "2"

[dev-dependencies]
tempfile = "3"
