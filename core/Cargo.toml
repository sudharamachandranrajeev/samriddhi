[package]
name = "samriddhi-core"
version = "0.2.0"
description = "Samriddhi's core: exact money, the encrypted store, the wizard profile, risk questions and next-best-step rules"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.5"
getrandom = "0.4"
jiff = { version = "0.2", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
